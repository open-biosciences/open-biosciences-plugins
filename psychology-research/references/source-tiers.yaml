# psycnet.apa.org — the PsycINFO/PsycArticles database. Tier-1 authority, but NOT
# REACHABLE by any connector: no query API at any access level (the /api/ route
# returns the SPA shell), robots.txt is "User-agent: * / Disallow: /", and APA
# reserves all text-mining and AI-training rights. The only sanctioned programmatic
# route is PsycINFO Data Solutions, a commercial bulk-dataset service, not a query
# interface. Credentials do not change this. Verified 2026-08-15.
# Do not plan retrievals against this host.
